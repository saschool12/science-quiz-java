<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NeuroQuiz AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --purple:#6c3df5;
    --purple2:#8b5cf6;
    --green:#20c997;
    --red:#ff5c70;
    --yellow:#ffca3a;
    --blue:#3d9bff;
    --bg:#f5f6fa;
    --dark:#252333;
    --muted:#777584;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f6fa;
    color:var(--dark);
}

/* TOP */

.top{
    height:64px;
    background:white;
    border-bottom:1px solid #e7e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:800;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    display:grid;
    place-items:center;
    color:white;
    background:linear-gradient(135deg,#7041f5,#9b6cff);
    font-size:20px;
}

.logo span{
    color:var(--purple);
}

.score{
    background:#f0ebff;
    color:var(--purple);
    padding:9px 15px;
    border-radius:20px;
    font-weight:700;
}

/* HOME */

.home{
    min-height:calc(100vh - 64px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 18px;
}

.home-card{
    width:min(680px,100%);
    background:white;
    border-radius:24px;
    padding:45px 30px;
    text-align:center;
    box-shadow:0 12px 45px rgba(30,20,60,.08);
}

.home-icon{
    width:85px;
    height:85px;
    margin:0 auto 22px;
    border-radius:22px;
    display:grid;
    place-items:center;
    font-size:42px;
    background:#eee8ff;
}

.home h1{
    font-size:38px;
    margin-bottom:12px;
}

.home p{
    max-width:500px;
    margin:auto;
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
}

.start{
    margin-top:30px;
    border:0;
    background:var(--purple);
    color:white;
    padding:16px 45px;
    border-radius:12px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 7px 0 #4f29c7;
    transition:.15s;
}

.start:hover{
    transform:translateY(2px);
    box-shadow:0 5px 0 #4f29c7;
}

/* QUIZ */

.quiz{
    display:none;
    min-height:calc(100vh - 64px);
    padding:20px;
}

.quiz-wrap{
    width:min(1000px,100%);
    margin:auto;
}

/* progress */

.progress-area{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
}

.progress{
    flex:1;
    height:10px;
    background:#e1e2e8;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:var(--purple);
    border-radius:20px;
    transition:.4s;
}

.counter{
    font-weight:700;
    color:#6e6c78;
    font-size:14px;
}

/* question */

.question-card{
    background:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 8px 30px rgba(30,20,60,.07);
    margin-bottom:18px;
}

.ai-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:var(--purple);
    background:#f0ebff;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    margin-bottom:20px;
}

.question{
    font-size:clamp(25px,4vw,38px);
    line-height:1.25;
}

/* answers */

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    min-height:100px;
    border:0;
    border-radius:17px;
    color:white;
    padding:20px;
    text-align:left;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.15);
    transition:.15s;
    display:flex;
    align-items:center;
    gap:15px;
}

.answer:hover{
    transform:translateY(-2px);
}

.answer:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 rgba(0,0,0,.15);
}

.answer:nth-child(1){
    background:#e94f64;
}

.answer:nth-child(2){
    background:#3d8df5;
}

.answer:nth-child(3){
    background:#f4ae24;
}

.answer:nth-child(4){
    background:#24b98b;
}

.letter{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:11px;
    background:rgba(255,255,255,.2);
    display:grid;
    place-items:center;
    font-size:16px;
}

.answer.correct{
    outline:5px solid rgba(32,201,151,.25);
    transform:scale(1.015);
}

.answer.wrong{
    opacity:.55;
}

.answer:disabled{
    cursor:default;
}

/* explanation */

.explanation{
    display:none;
    margin-top:18px;
    background:white;
    padding:18px 20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    line-height:1.5;
}

.explanation strong{
    color:var(--purple);
}

/* next */

.next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:16px;
    border:0;
    border-radius:13px;
    background:var(--purple);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

/* loading */

.loading{
    display:none;
    text-align:center;
    padding:100px 20px;
}

.loader{
    width:48px;
    height:48px;
    border:5px solid #ddd;
    border-top-color:var(--purple);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:auto auto 18px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* result */

.result{
    display:none;
    text-align:center;
    background:white;
    border-radius:22px;
    padding:60px 25px;
    box-shadow:0 10px 40px rgba(0,0,0,.07);
}

.result-icon{
    font-size:65px;
    margin-bottom:15px;
}

.result h1{
    font-size:34px;
}

.final-score{
    font-size:38px;
    font-weight:800;
    color:var(--purple);
    margin:18px;
}

.restart{
    border:0;
    background:var(--purple);
    color:white;
    padding:14px 30px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

/* mobile */

@media(max-width:650px){

    .top{
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    .quiz{
        padding:13px;
    }

    .question-card{
        padding:25px 18px;
    }

    .answers{
        grid-template-columns:1fr;
        gap:12px;
    }

    .answer{
        min-height:75px;
        font-size:15px;
    }

    .home-card{
        padding:35px 20px;
    }

    .home h1{
        font-size:29px;
    }
}
</style>
</head>

<body>

<header class="top">

    <div class="logo">
        <div class="logo-icon">✦</div>
        Neuro<span>Quiz</span> AI
    </div>

    <div class="score">
        🏆 <span id="score">0</span>
    </div>

</header>


<!-- HOME -->

<section id="home" class="home">

    <div class="home-card">

        <div class="home-icon">
            🧠
        </div>

        <h1>
            Science Challenge
        </h1>

        <p>
            Test your knowledge with
            AI-generated questions covering
            biology, chemistry, physics,
            astronomy and more.
        </p>

        <button
            class="start"
            onclick="startQuiz()">
            Start Quiz →
        </button>

    </div>

</section>


<!-- QUIZ -->

<section id="quiz" class="quiz">

<div class="quiz-wrap">

    <div class="progress-area">

        <div class="progress">
            <div
                id="progress"
                class="progress-bar">
            </div>
        </div>

        <div class="counter">
            <span id="number">0</span>
            / 10
        </div>

    </div>


    <div id="questionArea">

        <div class="question-card">

            <div class="ai-label">
                ✨ AI GENERATED
            </div>

            <h1
                id="question"
                class="question">
            </h1>

        </div>


        <div
            id="answers"
            class="answers">
        </div>


        <div
            id="explanation"
            class="explanation">
        </div>


        <button
            id="next"
            class="next"
            onclick="nextQuestion()">
            Next Question →
        </button>

    </div>


    <div
        id="loading"
        class="loading">

        <div class="loader"></div>

        <h3>
            AI is creating your question...
        </h3>

    </div>


    <div
        id="result"
        class="result">

        <div class="result-icon">
            🏆
        </div>

        <h1>
            Quiz Complete!
        </h1>

        <p>
            Here's your final score
        </p>

        <div
            id="finalScore"
            class="final-score">
        </div>

        <button
            class="restart"
            onclick="restart()">
            Play Again
        </button>

    </div>

</div>

</section>


<script>

let score = 0;
let questionNumber = 0;
let currentQuiz = null;
let answered = false;

const MAX_QUESTIONS = 10;


function startQuiz(){

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("quiz")
        .style.display = "block";

    generateQuestion();
}


async function generateQuestion(){

    if(questionNumber >= MAX_QUESTIONS){
        showResult();
        return;
    }

    answered = false;

    document.getElementById("questionArea")
        .style.display = "none";

    document.getElementById("loading")
        .style.display = "block";

    document.getElementById("next")
        .style.display = "none";

    document.getElementById("explanation")
        .style.display = "none";

    try{

        const response =
            await fetch("/api/question");

        const data =
            await response.json();

        if(!response.ok){
            throw new Error(
                data.error ||
                "Unable to generate question."
            );
        }

        currentQuiz = data;

        questionNumber++;

        document.getElementById("number")
            .textContent = questionNumber;

        document.getElementById("score")
            .textContent = score;

        document.getElementById("progress")
            .style.width =
            ((questionNumber - 1) /
            MAX_QUESTIONS * 100) + "%";

        document.getElementById("question")
            .textContent = data.question;

        const answers =
            document.getElementById("answers");

        answers.innerHTML = "";

        data.choices.forEach(
            (choice,index)=>{

                const button =
                    document.createElement("button");

                button.className = "answer";

                button.innerHTML = `
                    <span class="letter">
                        ${String.fromCharCode(65+index)}
                    </span>
                    ${escapeHTML(choice)}
                `;

                button.onclick = () =>
                    selectAnswer(index,button);

                answers.appendChild(button);
            }
        );

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("questionArea")
            .style.display = "block";

    }catch(error){

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("questionArea")
            .style.display = "block";

        document.getElementById("question")
            .textContent = "⚠️ Error";

        document.getElementById("answers")
            .innerHTML = `
                <div style="
                    grid-column:1/-1;
                    background:white;
                    padding:20px;
                    border-radius:15px;
                    color:#777;
                    text-align:center;">
                    ${escapeHTML(error.message)}
                </div>
            `;
    }
}


function selectAnswer(selected,button){

    if(answered) return;

    answered = true;

    const correct =
        currentQuiz.answer;

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(
        (btn,index)=>{

            btn.disabled = true;

            if(index === correct){
                btn.classList.add("correct");
            }
        }
    );

    if(selected === correct){

        score++;

        button.classList.add("correct");

    }else{

        button.classList.add("wrong");

    }

    document.getElementById("score")
        .textContent = score;

    document.getElementById("explanation")
        .innerHTML = `
            <strong>💡 Explanation</strong><br>
            ${escapeHTML(currentQuiz.explanation)}
        `;

    document.getElementById("explanation")
        .style.display = "block";

    document.getElementById("next")
        .style.display = "block";
}


function nextQuestion(){

    document.getElementById("progress")
        .style.width =
        (questionNumber / MAX_QUESTIONS * 100) + "%";

    if(questionNumber >= MAX_QUESTIONS){

        showResult();

    }else{

        generateQuestion();

    }
}


function showResult(){

    document.getElementById("questionArea")
        .style.display = "none";

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";

    document.getElementById("finalScore")
        .textContent =
        score + " / " + MAX_QUESTIONS;
}


function restart(){

    score = 0;
    questionNumber = 0;

    document.getElementById("score")
        .textContent = "0";

    document.getElementById("result")
        .style.display = "none";

    generateQuestion();
}


function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>

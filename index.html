<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>NeuroQuiz AI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --purple:#6c3df5;
    --purple-dark:#5229c9;
    --green:#20c997;
    --red:#ff5c70;
    --yellow:#ffca3a;
    --blue:#3d9bff;
    --bg:#f5f6fa;
    --text:#292735;
    --muted:#777584;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */

.top{
    height:64px;
    background:white;
    border-bottom:1px solid #e6e6eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:800;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:linear-gradient(
        135deg,
        #7041f5,
        #9a6cff
    );
    display:grid;
    place-items:center;
    color:white;
}

.logo span{
    color:var(--purple);
}

.score{
    background:#f0ebff;
    color:var(--purple);
    padding:9px 15px;
    border-radius:20px;
    font-weight:bold;
}

/* HOME */

.home{
    min-height:calc(100vh - 64px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.home-card{
    width:min(680px,100%);
    background:white;
    padding:45px 30px;
    text-align:center;
    border-radius:24px;
    box-shadow:0 12px 45px rgba(30,20,60,.08);
}

.home-icon{
    width:85px;
    height:85px;
    border-radius:22px;
    background:#eee8ff;
    display:grid;
    place-items:center;
    font-size:42px;
    margin:auto auto 20px;
}

.home h1{
    font-size:38px;
    margin-bottom:12px;
}

.home p{
    color:var(--muted);
    line-height:1.6;
    max-width:520px;
    margin:auto;
}

.start{
    margin-top:30px;
    border:0;
    background:var(--purple);
    color:white;
    padding:16px 45px;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 0 var(--purple-dark);
}

.start:active{
    transform:translateY(3px);
    box-shadow:0 3px 0 var(--purple-dark);
}

/* QUIZ */

.quiz{
    display:none;
    min-height:calc(100vh - 64px);
    padding:20px;
}

.quiz-wrap{
    width:min(1000px,100%);
    margin:auto;
}

/* PROGRESS */

.progress-area{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
}

.progress{
    flex:1;
    height:10px;
    background:#dedfe5;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:var(--purple);
    transition:.4s;
}

.counter{
    font-size:14px;
    font-weight:bold;
    color:var(--muted);
}

/* QUESTION */

.question-card{
    background:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 8px 30px rgba(30,20,60,.07);
    margin-bottom:18px;
}

.ai-label{
    display:inline-block;
    background:#f0ebff;
    color:var(--purple);
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:20px;
}

.question{
    font-size:clamp(25px,4vw,38px);
    line-height:1.25;
}

/* ANSWERS */

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.answer{
    min-height:100px;
    border:0;
    border-radius:17px;
    color:white;
    padding:20px;
    text-align:left;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.15);
    transition:.15s;
    display:flex;
    align-items:center;
    gap:15px;
}

.answer:hover{
    transform:translateY(-2px);
}

.answer:nth-child(1){
    background:#e94f64;
}

.answer:nth-child(2){
    background:#3d8df5;
}

.answer:nth-child(3){
    background:#f4ae24;
}

.answer:nth-child(4){
    background:#24b98b;
}

.answer:active{
    transform:translateY(3px);
}

.letter{
    width:40px;
    height:40px;
    min-width:40px;
    border-radius:11px;
    background:rgba(255,255,255,.2);
    display:grid;
    place-items:center;
}

.answer.correct{
    outline:5px solid rgba(32,201,151,.25);
}

.answer.wrong{
    opacity:.5;
}

.answer:disabled{
    cursor:default;
}

/* EXPLANATION */

.explanation{
    display:none;
    margin-top:18px;
    background:white;
    padding:18px;
    border-radius:15px;
    line-height:1.5;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.explanation strong{
    color:var(--purple);
}

/* NEXT */

.next{
    display:none;
    width:100%;
    margin-top:18px;
    padding:16px;
    border:0;
    border-radius:13px;
    background:var(--purple);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* LOADING */

.loading{
    display:none;
    text-align:center;
    padding:100px 20px;
}

.loader{
    width:48px;
    height:48px;
    border:5px solid #ddd;
    border-top-color:var(--purple);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:auto auto 18px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* RESULT */

.result{
    display:none;
    text-align:center;
    background:white;
    border-radius:22px;
    padding:60px 25px;
}

.result-icon{
    font-size:65px;
}

.result h1{
    font-size:34px;
    margin:15px 0 5px;
}

.final-score{
    font-size:38px;
    font-weight:bold;
    color:var(--purple);
    margin:18px;
}

.restart{
    border:0;
    background:var(--purple);
    color:white;
    padding:14px 30px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

/* PRELOAD STATUS */

.preload{
    text-align:center;
    color:#aaa;
    font-size:12px;
    margin-top:12px;
}

/* MOBILE */

@media(max-width:650px){

    .top{
        padding:0 14px;
    }

    .logo{
        font-size:17px;
    }

    .quiz{
        padding:13px;
    }

    .question-card{
        padding:25px 18px;
    }

    .answers{
        grid-template-columns:1fr;
        gap:12px;
    }

    .answer{
        min-height:75px;
        font-size:15px;
    }

    .home-card{
        padding:35px 20px;
    }

    .home h1{
        font-size:29px;
    }
}

</style>

</head>

<body>


<header class="top">

    <div class="logo">

        <div class="logo-icon">
            ✦
        </div>

        Neuro<span>Quiz</span> AI

    </div>

    <div class="score">
        🏆 <span id="score">0</span>
    </div>

</header>


<!-- HOME -->

<section id="home" class="home">

    <div class="home-card">

        <div class="home-icon">
            🧠
        </div>

        <h1>
            Science Challenge
        </h1>

        <p>
            Test your knowledge with
            AI-generated science questions.
            Every question is generated by Gemini.
        </p>

        <button
            class="start"
            onclick="startQuiz()"
        >
            Start Quiz →
        </button>

    </div>

</section>


<!-- QUIZ -->

<section id="quiz" class="quiz">

<div class="quiz-wrap">


    <div class="progress-area">

        <div class="progress">

            <div
                id="progress"
                class="progress-bar"
            ></div>

        </div>

        <div class="counter">

            <span id="number">0</span>
            / 10

        </div>

    </div>


    <!-- QUESTION -->

    <div id="questionArea">

        <div class="question-card">

            <div class="ai-label">
                ✨ AI GENERATED
            </div>

            <h1
                id="question"
                class="question"
            ></h1>

        </div>


        <div
            id="answers"
            class="answers"
        ></div>


        <div
            id="explanation"
            class="explanation"
        ></div>


        <div
            id="preload"
            class="preload"
        >
            🤖 Preparing next question...
        </div>


        <button
            id="next"
            class="next"
            onclick="nextQuestion()"
        >
            Next Question →
        </button>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loader"></div>

        <h3>
            Preparing your first question...
        </h3>

    </div>


    <!-- RESULT -->

    <div
        id="result"
        class="result"
    >

        <div class="result-icon">
            🏆
        </div>

        <h1>
            Quiz Complete!
        </h1>

        <p>
            Your final score
        </p>

        <div
            id="finalScore"
            class="final-score"
        ></div>

        <button
            class="restart"
            onclick="restart()"
        >
            Play Again
        </button>

    </div>

</div>

</section>


<script>

let score = 0;

let questionNumber = 0;

let currentQuiz = null;

/*
    This is the important part.

    Instead of waiting for Gemini after
    every question, we immediately start
    preparing the next question.
*/

let nextQuestionPromise = null;

let answered = false;

const MAX_QUESTIONS = 10;


/* START */

function startQuiz(){

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("quiz")
        .style.display = "block";

    loadFirstQuestion();
}


/*
    FIRST QUESTION
*/

async function loadFirstQuestion(){

    document.getElementById("questionArea")
        .style.display = "none";

    document.getElementById("loading")
        .style.display = "block";

    try{

        currentQuiz =
            await fetchQuestion();

        showQuestion();

        /*
            Start preparing Question 2
            immediately.
        */

        preloadNext();

    }catch(error){

        showError(error);

    }
}


/*
    FETCH FROM GEMINI
*/

async function fetchQuestion(){

    const response =
        await fetch(
            "/api/question?t=" +
            Date.now() +
            Math.random()
        );

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error ||
            "Gemini request failed."
        );

    }

    return data;
}


/*
    PRELOAD NEXT QUESTION
*/

function preloadNext(){

    /*
        Don't create another request
        if one is already running.
    */

    if(nextQuestionPromise){
        return;
    }

    document.getElementById("preload")
        .textContent =
        "🤖 Preparing next question...";


    nextQuestionPromise =
        fetchQuestion()
        .then(data => {

            document.getElementById("preload")
                .textContent =
                "✓ Next question ready";

            return data;

        })
        .catch(error => {

            console.error(
                "Preload error:",
                error
            );

            return null;

        });
}


/*
    DISPLAY QUESTION
*/

function showQuestion(){

    answered = false;

    questionNumber++;

    document.getElementById("number")
        .textContent =
        questionNumber;

    document.getElementById("score")
        .textContent =
        score;

    document.getElementById("progress")
        .style.width =
        ((questionNumber - 1) /
        MAX_QUESTIONS * 100) + "%";


    document.getElementById("question")
        .textContent =
        currentQuiz.question;


    const answers =
        document.getElementById("answers");

    answers.innerHTML = "";


    currentQuiz.choices.forEach(
        (choice,index)=>{

            const button =
                document.createElement("button");

            button.className =
                "answer";

            button.innerHTML = `
                <span class="letter">
                    ${String.fromCharCode(65+index)}
                </span>
                ${escapeHTML(choice)}
            `;

            button.onclick =
                () => selectAnswer(
                    index,
                    button
                );

            answers.appendChild(button);

        }
    );


    document.getElementById("explanation")
        .style.display = "none";

    document.getElementById("next")
        .style.display = "none";

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("questionArea")
        .style.display = "block";
}


/*
    ANSWER
*/

function selectAnswer(
    selected,
    selectedButton
){

    if(answered){
        return;
    }

    answered = true;

    const correct =
        currentQuiz.answer;

    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(
        (button,index)=>{

            button.disabled = true;

            if(index === correct){

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if(selected === correct){

        score++;

        selectedButton.classList.add(
            "correct"
        );

    }else{

        selectedButton.classList.add(
            "wrong"
        );

    }


    document.getElementById("score")
        .textContent =
        score;


    document.getElementById("explanation")
        .innerHTML = `
            <strong>💡 Explanation</strong><br>
            ${escapeHTML(
                currentQuiz.explanation
            )}
        `;


    document.getElementById("explanation")
        .style.display = "block";


    document.getElementById("next")
        .style.display = "block";
}


/*
    NEXT QUESTION

    Because it was already preloaded,
    this should be much faster.
*/

async function nextQuestion(){

    if(questionNumber >= MAX_QUESTIONS){

        showResult();

        return;
    }


    document.getElementById("next")
        .style.display = "none";


    document.getElementById("preload")
        .textContent =
        "Loading...";


    /*
        Use the already-running request.
    */

    let nextQuiz =
        await nextQuestionPromise;


    /*
        If preload failed, request again.
    */

    if(!nextQuiz){

        nextQuiz =
            await fetchQuestion();

    }


    /*
        Clear old promise.
    */

    nextQuestionPromise = null;


    /*
        Display immediately.
    */

    currentQuiz =
        nextQuiz;

    showQuestion();


    /*
        Start preparing another question
        while user answers this one.
    */

    preloadNext();
}


/*
    RESULT
*/

function showResult(){

    document.getElementById("questionArea")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";

    document.getElementById("progress")
        .style.width = "100%";

    document.getElementById("finalScore")
        .textContent =
        score + " / " + MAX_QUESTIONS;
}


/*
    RESTART
*/

function restart(){

    score = 0;

    questionNumber = 0;

    currentQuiz = null;

    nextQuestionPromise = null;

    document.getElementById("score")
        .textContent = "0";

    document.getElementById("result")
        .style.display = "none";

    loadFirstQuestion();
}


/*
    ERROR
*/

function showError(error){

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("questionArea")
        .style.display = "block";

    document.getElementById("question")
        .textContent =
        "⚠️ Unable to generate question";

    document.getElementById("answers")
        .innerHTML = `
            <div style="
                grid-column:1/-1;
                background:white;
                padding:20px;
                border-radius:15px;
                color:#777;
                text-align:center;
            ">
                ${escapeHTML(error.message)}
            </div>
        `;
}


/*
    SECURITY
*/

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>

</html>

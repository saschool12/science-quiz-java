<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7fb;
  color: #252525;
}

.topbar {
  height: 70px;
  background: white;
  border-bottom: 1px solid #e8e8ee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.logo {
  font-size: 23px;
  font-weight: 800;
  color: #6c35de;
}

.badge {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  background: #f1efff;
  padding: 9px 14px;
  border-radius: 20px;
}

.container {
  width: min(900px, 92%);
  margin: 35px auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.start-card,
.quiz-card,
.result-card {
  background: white;
  border-radius: 22px;
  padding: 35px;
  box-shadow: 0 8px 30px rgba(40, 20, 80, 0.08);
}

.start-card {
  text-align: center;
  margin-top: 70px;
}

.start-icon {
  font-size: 60px;
  margin-bottom: 15px;
}

h1 {
  font-size: 38px;
  margin: 10px 0;
}

.subtitle {
  color: #777;
  font-size: 16px;
  margin-bottom: 30px;
}

button {
  border: none;
  cursor: pointer;
  font-family: inherit;
}

.start-btn,
.next-btn,
.restart-btn {
  background: #6c35de;
  color: white;
  font-size: 17px;
  font-weight: 700;
  padding: 15px 30px;
  border-radius: 12px;
}

.start-btn:hover,
.next-btn:hover,
.restart-btn:hover {
  background: #5725c4;
}

.progress-area {
  margin-bottom: 22px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 700;
  color: #777;
  margin-bottom: 9px;
}

.progress {
  width: 100%;
  height: 9px;
  background: #e9e7f0;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #6c35de;
  transition: width .3s;
}

.question {
  font-size: 29px;
  line-height: 1.3;
  margin: 20px 0 28px;
}

.answers {
  display: grid;
  gap: 14px;
}

.answer {
  width: 100%;
  text-align: left;
  padding: 19px;
  border: 2px solid #e5e4ea;
  background: white;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  transition: .15s;
}

.answer:hover:not(:disabled) {
  border-color: #6c35de;
  background: #faf8ff;
}

.answer.correct {
  border-color: #20a464;
  background: #e9fff4;
}

.answer.wrong {
  border-color: #e04b4b;
  background: #fff0f0;
}

.answer:disabled {
  cursor: default;
}

.feedback {
  min-height: 50px;
  margin-top: 20px;
  font-size: 15px;
  line-height: 1.5;
}

.feedback.good {
  color: #16834e;
}

.feedback.bad {
  color: #d03939;
}

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
}

.score {
  font-weight: 800;
}

.next-btn {
  display: none;
}

.loading {
  text-align: center;
  padding: 70px 20px;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #e5ddff;
  border-top-color: #6c35de;
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.source {
  font-size: 12px;
  color: #999;
  margin-top: 18px;
}

.result-card {
  text-align: center;
  margin-top: 70px;
}

.result-score {
  font-size: 58px;
  font-weight: 900;
  color: #6c35de;
  margin: 20px;
}

@media(max-width:600px) {
  .topbar {
    padding: 0 17px;
  }

  .container {
    width: 94%;
    margin: 20px auto;
  }

  .start-card,
  .quiz-card,
  .result-card {
    padding: 23px;
  }

  h1 {
    font-size: 30px;
  }

  .question {
    font-size: 23px;
  }

  .answer {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="logo">✦ Science Quiz</div>
  <div class="badge">AI Powered</div>
</header>

<main class="container">

<section id="startScreen" class="screen active">
  <div class="start-card">
    <div class="start-icon">🧪</div>
    <h1>Science Quiz</h1>
    <p class="subtitle">
      Test your knowledge with random science questions.
    </p>
    <button class="start-btn" onclick="startQuiz()">
      Start Quiz
    </button>
  </div>
</section>

<section id="quizScreen" class="screen">

  <div class="quiz-card">

    <div class="progress-area">
      <div class="progress-info">
        <span id="questionNumber">Question 1 of 10</span>
        <span id="scoreText">Score: 0</span>
      </div>

      <div class="progress">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <strong>Generating question...</strong>
    </div>

    <div id="questionArea" style="display:none">

      <div id="question" class="question"></div>

      <div id="answers" class="answers"></div>

      <div id="feedback" class="feedback"></div>

      <div class="bottom">
        <div id="source" class="source"></div>
        <button id="nextBtn" class="next-btn" onclick="nextQuestion()">
          Next →
        </button>
      </div>

    </div>

  </div>

</section>

<section id="resultScreen" class="screen">
  <div class="result-card">
    <div class="start-icon">🏆</div>
    <h1>Quiz Complete!</h1>

    <div id="resultScore" class="result-score">
      0/10
    </div>

    <p id="resultMessage" class="subtitle"></p>

    <button class="restart-btn" onclick="startQuiz()">
      Play Again
    </button>
  </div>
</section>

</main>

<script>
let score = 0;
let questionNumber = 0;
let currentQuiz = null;
let answered = false;

const MAX_QUESTIONS = 10;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}

function startQuiz() {
  score = 0;
  questionNumber = 0;
  currentQuiz = null;
  answered = false;

  showScreen("quizScreen");
  loadQuestion();
}

async function fetchQuestion() {
  const response = await fetch(
    "/api/question?t=" + Date.now()
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Failed to load question.");
  }

  return data;
}

async function loadQuestion() {
  answered = false;

  document.getElementById("loading").style.display = "block";
  document.getElementById("questionArea").style.display = "none";

  document.getElementById("questionNumber").textContent =
    `Question ${questionNumber + 1} of ${MAX_QUESTIONS}`;

  document.getElementById("scoreText").textContent =
    `Score: ${score}`;

  document.getElementById("progressFill").style.width =
    `${(questionNumber / MAX_QUESTIONS) * 100}%`;

  try {
    currentQuiz = await fetchQuestion();
    showQuestion();
  } catch (error) {
    // This should rarely happen because API already has fallback.
    showError();
  }
}

function showQuestion() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("questionArea").style.display = "block";

  document.getElementById("question").textContent =
    currentQuiz.question;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";

  document.getElementById("nextBtn").style.display = "none";

  currentQuiz.choices.forEach((choice, index) => {
    const button = document.createElement("button");

    button.className = "answer";
    button.textContent =
      `${String.fromCharCode(65 + index)}. ${choice}`;

    button.onclick = () =>
      selectAnswer(index, button);

    answers.appendChild(button);
  });

  const source = document.getElementById("source");

  if (currentQuiz.source === "ai") {
    source.textContent = "✦ AI-generated question";
  } else {
    source.textContent = "⚡ Backup question";
  }
}

function selectAnswer(index, clickedButton) {
  if (answered) return;

  answered = true;

  const buttons =
    document.querySelectorAll(".answer");

  buttons.forEach(button => {
    button.disabled = true;
  });

  const feedback =
    document.getElementById("feedback");

  if (index === currentQuiz.answer) {
    clickedButton.classList.add("correct");
    score++;

    feedback.classList.add("good");
    feedback.innerHTML =
      `<strong>Correct! 🎉</strong><br>${currentQuiz.explanation}`;
  } else {
    clickedButton.classList.add("wrong");

    buttons[currentQuiz.answer]
      .classList.add("correct");

    feedback.classList.add("bad");
    feedback.innerHTML =
      `<strong>Not quite.</strong><br>${currentQuiz.explanation}`;
  }

  document.getElementById("scoreText").textContent =
    `Score: ${score}`;

  document.getElementById("progressFill").style.width =
    `${((questionNumber + 1) / MAX_QUESTIONS) * 100}%`;

  document.getElementById("nextBtn").style.display =
    "block";
}

function nextQuestion() {
  questionNumber++;

  if (questionNumber >= MAX_QUESTIONS) {
    showResult();
    return;
  }

  loadQuestion();
}

function showResult() {
  showScreen("resultScreen");

  document.getElementById("resultScore").textContent =
    `${score}/${MAX_QUESTIONS}`;

  let message;

  if (score === MAX_QUESTIONS) {
    message = "Perfect score! 🧠🔥";
  } else if (score >= 8) {
    message = "Excellent work! 🎉";
  } else if (score >= 6) {
    message = "Good job! Keep learning! 💪";
  } else if (score >= 4) {
    message = "Nice try! You can do even better!";
  } else {
    message = "Keep practicing and try again!";
  }

  document.getElementById("resultMessage").textContent =
    message;
}

function showError() {
  document.getElementById("loading").innerHTML = `
    <div style="font-size:40px">⚠️</div>
    <p>Something went wrong.</p>
    <button class="start-btn" onclick="loadQuestion()">
      Try Again
    </button>
  `;
}
</script>

</body>
</html>

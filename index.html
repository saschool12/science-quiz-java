<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeuroQuiz AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #00ff88;
    --green2: #00c96b;
    --bg: #050706;
    --card: rgba(15, 20, 17, .78);
    --border: rgba(255,255,255,.09);
    --text: #f5f7f6;
    --muted: #8d9691;
    --red: #ff4d67;
    --yellow: #ffd166;
}

body {
    min-height: 100vh;
    font-family: Inter, Arial, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 15% 15%, rgba(0,255,136,.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0,200,255,.08), transparent 30%),
        #050706;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

/* animated background */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

.orb {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: var(--green);
    filter: blur(140px);
    opacity: .07;
    animation: float 8s infinite alternate ease-in-out;
}

.orb.one {
    top: -100px;
    left: -100px;
}

.orb.two {
    bottom: -100px;
    right: -100px;
    animation-delay: 2s;
}

@keyframes float {
    from { transform: translate(0,0); }
    to { transform: translate(50px,-30px); }
}

/* app */

.app {
    width: min(900px, 94%);
    margin: 30px auto;
    position: relative;
    z-index: 2;
}

/* top bar */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 44px;
    height: 44px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-size: 21px;
    background: linear-gradient(135deg, #00ff88, #00b968);
    color: #00150b;
    box-shadow: 0 0 25px rgba(0,255,136,.22);
}

.brand h1 {
    font-size: 19px;
}

.brand p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
}

.scorebox {
    padding: 10px 15px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.045);
    backdrop-filter: blur(15px);
    border-radius: 13px;
}

.scorebox span {
    color: var(--muted);
    font-size: 11px;
}

.scorebox strong {
    color: var(--green);
    margin-left: 5px;
}

/* card */

.card {
    border: 1px solid var(--border);
    background: var(--card);
    backdrop-filter: blur(25px);
    border-radius: 25px;
    padding: 32px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.04);
}

/* status */

.statusrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.ai-status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
}

.counter {
    font-size: 13px;
    color: var(--muted);
}

/* progress */

.progress {
    height: 5px;
    width: 100%;
    background: rgba(255,255,255,.07);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 38px;
}

.progressbar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), #7affbd);
    box-shadow: 0 0 15px rgba(0,255,136,.45);
    transition: width .5s ease;
}

/* question */

.question {
    font-size: clamp(25px, 5vw, 39px);
    line-height: 1.18;
    letter-spacing: -.8px;
    margin-bottom: 30px;
}

.question::first-letter {
    color: var(--green);
}

/* answers */

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.answer {
    position: relative;
    min-height: 68px;
    padding: 16px 18px;
    border-radius: 15px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.035);
    color: #dce2df;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    transition: .2s ease;
}

.answer:hover {
    border-color: rgba(0,255,136,.45);
    background: rgba(0,255,136,.06);
    transform: translateY(-2px);
}

.answer .letter {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    margin-right: 10px;
    background: rgba(255,255,255,.07);
    color: #9da59f;
    font-weight: bold;
}

.answer.correct {
    border-color: var(--green);
    background: rgba(0,255,136,.10);
    color: var(--green);
    box-shadow: 0 0 25px rgba(0,255,136,.08);
}

.answer.correct .letter {
    background: var(--green);
    color: #00150b;
}

.answer.wrong {
    border-color: var(--red);
    background: rgba(255,77,103,.09);
    color: #ff8396;
}

.answer.wrong .letter {
    background: var(--red);
    color: white;
}

.answer:disabled {
    cursor: default;
}

/* explanation */

.explanation {
    margin-top: 20px;
    padding: 17px;
    border-radius: 14px;
    background: rgba(255,255,255,.035);
    border: 1px solid var(--border);
    color: #adb6b1;
    line-height: 1.55;
    display: none;
}

.explanation b {
    color: var(--green);
}

/* buttons */

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 22px;
}

button {
    font-family: inherit;
}

.generate,
.next {
    flex: 1;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.generate {
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: #00150b;
    box-shadow: 0 8px 25px rgba(0,255,136,.12);
}

.generate:hover,
.next:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,255,136,.2);
}

.next {
    display: none;
    background: #eafff4;
    color: #00150b;
}

/* loading */

.loading {
    display: none;
    padding: 50px 20px;
    text-align: center;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 18px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* welcome */

.welcome {
    text-align: center;
    padding: 35px 10px 10px;
}

.welcome-icon {
    font-size: 55px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 18px rgba(0,255,136,.25));
}

.welcome h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.welcome p {
    color: var(--muted);
    max-width: 520px;
    margin: auto;
    line-height: 1.6;
}

/* result */

.result {
    display: none;
    text-align: center;
    padding: 50px 20px;
}

.trophy {
    font-size: 70px;
    margin-bottom: 15px;
}

.result h2 {
    font-size: 34px;
}

.finalscore {
    color: var(--green);
    font-size: 35px;
    font-weight: bold;
    margin: 18px;
}

.restart {
    padding: 14px 28px;
    border: 0;
    border-radius: 12px;
    background: var(--green);
    color: #00150b;
    font-weight: bold;
    cursor: pointer;
}

/* mobile */

@media(max-width:650px) {

    .card {
        padding: 22px;
        border-radius: 20px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 27px;
    }

    .buttons {
        flex-direction: column;
    }

    .topbar {
        margin-bottom: 13px;
    }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="app">

    <div class="topbar">

        <div class="brand">

            <div class="logo">✦</div>

            <div>
                <h1>NeuroQuiz AI</h1>
                <p>Powered by Gemini</p>
            </div>

        </div>

        <div class="scorebox">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

    </div>


    <section class="card">

        <div id="welcome" class="welcome">

            <div class="welcome-icon">🧠</div>

            <h2>Test Your Science Knowledge</h2>

            <p>
                Gemini AI generates a fresh science
                question every time. Physics, biology,
                chemistry, astronomy and more.
            </p>

        </div>


        <div id="quiz" style="display:none;">

            <div class="statusrow">

                <div class="ai-status">
                    <span class="dot"></span>
                    <span id="status">AI Ready</span>
                </div>

                <div class="counter">
                    Question <span id="number">0</span>
                </div>

            </div>


            <div class="progress">
                <div
                    id="progressbar"
                    class="progressbar">
                </div>
            </div>


            <h2
                id="question"
                class="question">
            </h2>


            <div
                id="answers"
                class="answers">
            </div>


            <div
                id="explanation"
                class="explanation">
            </div>


            <div class="buttons">

                <button
                    id="generate"
                    class="generate"
                    onclick="generateQuestion()">
                    ✨ Generate AI Question
                </button>

                <button
                    id="next"
                    class="next"
                    onclick="generateQuestion()">
                    Next Question →
                </button>

            </div>

        </div>


        <div
            id="loading"
            class="loading">

            <div class="spinner"></div>

            <p>Gemini is thinking...</p>

        </div>


        <div
            id="result"
            class="result">

            <div class="trophy">🏆</div>

            <h2>Quiz Complete!</h2>

            <p>
                Nice work. Here's your final score:
            </p>

            <div
                id="finalscore"
                class="finalscore">
            </div>

            <button
                class="restart"
                onclick="restart()">
                Play Again
            </button>

        </div>

    </section>

</main>


<script>

let score = 0;
let questionNumber = 0;
let currentQuiz = null;
let answered = false;


const welcome =
document.getElementById("welcome");

const quiz =
document.getElementById("quiz");

const loading =
document.getElementById("loading");

const result =
document.getElementById("result");

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const explanation =
document.getElementById("explanation");

const status =
document.getElementById("status");

const number =
document.getElementById("number");

const scoreEl =
document.getElementById("score");

const progress =
document.getElementById("progressbar");

const generate =
document.getElementById("generate");

const next =
document.getElementById("next");


async function generateQuestion() {

    answered = false;

    welcome.style.display = "none";
    quiz.style.display = "none";
    result.style.display = "none";
    loading.style.display = "block";

    answers.innerHTML = "";

    explanation.style.display = "none";

    next.style.display = "none";

    try {

        const response =
            await fetch("/api/question");

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Gemini request failed."
            );
        }

        currentQuiz = data;

        questionNumber++;

        question.textContent =
            data.question;

        number.textContent =
            questionNumber;

        status.textContent =
            "Gemini generated a question";

        progress.style.width =
            Math.min(
                questionNumber * 10,
                100
            ) + "%";


        data.choices.forEach(
            (choice, index) => {

                const button =
                    document.createElement("button");

                button.className =
                    "answer";

                button.innerHTML = `
                    <span class="letter">
                        ${String.fromCharCode(65 + index)}
                    </span>
                    ${escapeHTML(choice)}
                `;

                button.onclick = () =>
                    selectAnswer(
                        index,
                        button
                    );

                answers.appendChild(button);

            }
        );


        loading.style.display = "none";
        quiz.style.display = "block";

    } catch(error) {

        loading.style.display = "none";
        quiz.style.display = "block";

        question.textContent =
            "⚠️ Unable to generate question";

        status.textContent =
            error.message;

    }
}


function selectAnswer(
    selected,
    selectedButton
) {

    if (answered) return;

    answered = true;

    const correct =
        currentQuiz.answer;

    const buttons =
        document.querySelectorAll(".answer");


    buttons.forEach(
        (button, index) => {

            button.disabled = true;

            if (index === correct) {
                button.classList.add("correct");
            }

        }
    );


    if (selected === correct) {

        score++;

        scoreEl.textContent = score;

        selectedButton.classList.add("correct");

        status.textContent =
            "✓ Correct! Great job.";

    } else {

        selectedButton.classList.add("wrong");

        status.textContent =
            "✕ Not quite. Keep learning.";

    }


    explanation.innerHTML = `
        <b>💡 Explanation</b><br>
        ${escapeHTML(currentQuiz.explanation)}
    `;

    explanation.style.display = "block";

    generate.style.display = "none";
    next.style.display = "block";
}


function restart() {

    score = 0;
    questionNumber = 0;

    scoreEl.textContent = "0";

    result.style.display = "none";

    generateQuestion();
}


function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>

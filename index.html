<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>AI Science Quiz</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #123d29,
            #050505 60%
        );

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 850px;

    background: #101010;

    border: 1px solid #292929;

    border-radius: 22px;

    overflow: hidden;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55);
}

header {
    padding: 24px 28px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom: 1px solid #292929;
}

.logo {
    font-size: 21px;

    font-weight: bold;
}

.logo span {
    color: #00e676;
}

.score {
    background: #1b1b1b;

    color: #00e676;

    padding: 9px 15px;

    border-radius: 10px;

    font-weight: bold;
}

.content {
    padding: 35px;
}

.status {
    color: #888;

    margin-bottom: 20px;

    font-size: 14px;
}

.progress {
    height: 7px;

    background: #242424;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 30px;
}

.bar {
    height: 100%;

    width: 0%;

    background: #00e676;

    transition: .3s;
}

.question {
    font-size:
        clamp(24px,5vw,36px);

    line-height: 1.3;

    margin-bottom: 28px;
}

.answers {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 14px;
}

.answer {
    padding: 18px;

    background: #171717;

    color: #ddd;

    border: 1px solid #2d2d2d;

    border-radius: 12px;

    cursor: pointer;

    text-align: left;

    font-size: 15px;

    transition: .2s;
}

.answer:hover {
    border-color: #00e676;

    transform: translateY(-2px);
}

.answer.correct {
    border-color: #00e676;

    color: #00e676;

    background:
        rgba(0,230,118,.12);
}

.answer.wrong {
    border-color: #ff5252;

    color: #ff5252;

    background:
        rgba(255,82,82,.12);
}

.answer:disabled {
    cursor: default;
}

button.next {
    width: 100%;

    padding: 15px;

    margin-top: 25px;

    border: none;

    border-radius: 10px;

    background: #00e676;

    color: #000;

    font-weight: bold;

    cursor: pointer;

    display: none;
}

button.next:hover {
    background: #00c968;
}

.generate {
    width: 100%;

    padding: 15px;

    margin-bottom: 25px;

    border: none;

    border-radius: 10px;

    background: #00e676;

    color: #000;

    font-weight: bold;

    cursor: pointer;
}

.loading {
    text-align: center;

    color: #888;

    padding: 40px;
}

.explanation {
    display: none;

    margin-top: 20px;

    padding: 16px;

    border-radius: 10px;

    background: #191919;

    color: #aaa;

    line-height: 1.5;
}

.result {
    display: none;

    text-align: center;

    padding: 55px 25px;
}

.result h1 {
    font-size: 38px;

    margin-bottom: 15px;
}

.final-score {
    color: #00e676;

    font-size: 28px;

    font-weight: bold;

    margin: 25px;
}

.restart {
    padding: 14px 28px;

    border: none;

    border-radius: 10px;

    background: #00e676;

    color: #000;

    font-weight: bold;

    cursor: pointer;
}

@media(max-width:650px) {

    .content {
        padding: 25px 18px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">
🤖 <span>AI Science</span> Quiz
</div>

<div class="score" id="score">
Score: 0
</div>

</header>


<div class="content" id="game">

<button
class="generate"
onclick="generateQuestion()"
>
✨ Generate Random Question
</button>


<div
class="status"
id="status"
>
Press the button to generate a question.
</div>


<div class="progress">

<div
class="bar"
id="bar"
></div>

</div>


<h1
class="question"
id="question"
>
Ready?
</h1>


<div
class="answers"
id="answers"
></div>


<div
class="explanation"
id="explanation"
></div>


<button
class="next"
id="next"
onclick="generateQuestion()"
>
Next AI Question →
</button>

</div>


<div
class="result"
id="result"
>

<h1>
🏆 Quiz Complete!
</h1>

<p>
You finished the AI Science Quiz.
</p>

<div
class="final-score"
id="finalScore"
></div>

<button
class="restart"
onclick="restartQuiz()"
>
Play Again
</button>

</div>

</div>


<script>

let score = 0;

let questionNumber = 0;

let currentQuiz = null;

let answered = false;


const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const status =
document.getElementById("status");

const explanation =
document.getElementById("explanation");

const next =
document.getElementById("next");

const scoreElement =
document.getElementById("score");

const bar =
document.getElementById("bar");


async function generateQuestion() {

    answered = false;

    answers.innerHTML = "";

    explanation.style.display =
        "none";

    next.style.display =
        "none";

    question.textContent =
        "Generating question...";

    status.textContent =
        "🤖 Gemini is creating a random science question...";


    try {

        const response =
            await fetch("/api/question");

        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to generate question."
            );

        }


        currentQuiz = data;

        questionNumber++;


        status.textContent =
            `AI Question ${questionNumber}`;


        bar.style.width =
            `${Math.min(
                questionNumber * 10,
                100
            )}%`;


        question.textContent =
            data.question;


        data.choices.forEach(
            (choice,index) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "answer";

                button.textContent =
                    `${String.fromCharCode(
                        65 + index
                    )}. ${choice}`;


                button.onclick =
                    () =>
                    selectAnswer(
                        index,
                        button
                    );


                answers.appendChild(
                    button
                );

            }
        );

    } catch(error) {

        question.textContent =
            "Something went wrong.";

        status.textContent =
            error.message;

    }

}


function selectAnswer(
    selected,
    selectedButton
) {

    if (answered) return;

    answered = true;


    const correct =
        currentQuiz.answer;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        (button,index) => {

            button.disabled = true;

            if (index === correct) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    if (selected === correct) {

        score++;

        scoreElement.textContent =
            `Score: ${score}`;

    } else {

        selectedButton.classList.add(
            "wrong"
        );

    }


    explanation.textContent =
        "💡 " +
        currentQuiz.explanation;


    explanation.style.display =
        "block";


    next.style.display =
        "block";
}


function restartQuiz() {

    score = 0;

    questionNumber = 0;

    scoreElement.textContent =
        "Score: 0";

    document.getElementById(
        "result"
    ).style.display = "none";

    document.getElementById(
        "game"
    ).style.display = "block";

    generateQuestion();
}

</script>

</body>

</html>

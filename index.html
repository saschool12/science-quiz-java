<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Science Rush</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at 15% 15%,#47208c 0,transparent 35%),
 radial-gradient(circle at 85% 80%,#103e91 0,transparent 35%),
 #090b16;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 pointer-events:none;
 background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);
 background-size:30px 30px;
}

.header{
 height:70px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 background:rgba(9,11,22,.75);
 border-bottom:1px solid rgba(255,255,255,.08);
 backdrop-filter:blur(20px);
}

.logo{
 display:flex;
 align-items:center;
 gap:10px;
 font-size:21px;
 font-weight:900;
}

.logo-icon{
 width:38px;
 height:38px;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:linear-gradient(135deg,#8b5cf6,#3b82f6);
 box-shadow:0 0 25px rgba(124,92,246,.5);
}

.badge{
 padding:8px 13px;
 border-radius:20px;
 font-size:12px;
 font-weight:800;
 background:rgba(139,92,246,.15);
 color:#c9b8ff;
}

.container{
 width:min(920px,92%);
 margin:auto;
 padding:45px 0 70px;
}

.screen{display:none}
.screen.active{display:block}

.glass{
 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.055);
 backdrop-filter:blur(25px);
 box-shadow:0 30px 80px rgba(0,0,0,.35);
 border-radius:28px;
}

.start{
 text-align:center;
 padding:70px 30px;
}

.start-icon{
 width:100px;
 height:100px;
 margin:0 auto 25px;
 display:grid;
 place-items:center;
 border-radius:30px;
 font-size:50px;
 background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(59,130,246,.25));
}

h1{
 font-size:clamp(36px,7vw,60px);
 margin:0 0 15px;
 background:linear-gradient(90deg,#fff,#c9b8ff,#83b8ff);
 -webkit-background-clip:text;
 color:transparent;
}

.subtitle{
 color:#a9acbd;
 font-size:16px;
 margin-bottom:32px;
}

.primary{
 border:0;
 padding:17px 35px;
 border-radius:15px;
 color:white;
 font-size:16px;
 font-weight:900;
 cursor:pointer;
 background:linear-gradient(135deg,#8b5cf6,#3b82f6);
 box-shadow:0 10px 35px rgba(91,70,220,.4);
}

.primary:hover{
 transform:translateY(-3px);
}

.quiz{padding:28px}

.top-info{
 display:flex;
 justify-content:space-between;
 margin-bottom:14px;
}

.question-number{
 color:#aaaec1;
 font-weight:800;
}

.score{
 font-weight:900;
 color:#c8b5ff;
}

.progress{
 height:8px;
 background:rgba(255,255,255,.08);
 border-radius:20px;
 overflow:hidden;
 margin-bottom:32px;
}

.progress-fill{
 height:100%;
 width:0;
 background:linear-gradient(90deg,#8b5cf6,#3b82f6);
 transition:.4s;
}

.loading{
 text-align:center;
 padding:90px 20px;
}

.spinner{
 width:48px;
 height:48px;
 margin:0 auto 20px;
 border:4px solid rgba(255,255,255,.1);
 border-top-color:#8b5cf6;
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.question-label{
 color:#a98cff;
 font-size:12px;
 font-weight:900;
 letter-spacing:1.5px;
 margin-bottom:12px;
}

.question{
 font-size:clamp(24px,5vw,36px);
 line-height:1.25;
 font-weight:900;
 margin-bottom:30px;
}

.answers{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}

.answer{
 min-height:82px;
 padding:20px;
 text-align:left;
 color:#fff;
 font-size:16px;
 font-weight:800;
 border-radius:17px;
 border:1px solid rgba(255,255,255,.1);
 background:rgba(255,255,255,.055);
 cursor:pointer;
 transition:.18s;
}

.answer:hover:not(:disabled){
 transform:translateY(-3px);
 border-color:#8b5cf6;
}

.answer.correct{
 background:rgba(34,197,94,.15);
 border-color:#22c55e;
 color:#8ff0b0;
}

.answer.wrong{
 background:rgba(239,68,68,.15);
 border-color:#ef4444;
 color:#ff9c9c;
}

.answer:disabled{cursor:default}

.feedback{
 display:none;
 margin-top:20px;
 padding:17px;
 border-radius:15px;
 line-height:1.5;
}

.feedback.show{display:block}

.feedback.good{
 background:rgba(34,197,94,.09);
 color:#8ff0b0;
}

.feedback.bad{
 background:rgba(239,68,68,.09);
 color:#ffabab;
}

.bottom{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-top:18px;
}

.source{
 color:#73778c;
 font-size:12px;
}

.next{
 display:none;
 border:0;
 padding:13px 22px;
 border-radius:12px;
 color:white;
 font-weight:900;
 cursor:pointer;
 background:linear-gradient(135deg,#8b5cf6,#3b82f6);
}

.result{
 text-align:center;
 padding:65px 30px;
}

.trophy{
 font-size:70px;
}

.final-score{
 font-size:65px;
 font-weight:900;
 margin:15px 0;
 background:linear-gradient(90deg,#8b5cf6,#60a5fa);
 -webkit-background-clip:text;
 color:transparent;
}

@media(max-width:650px){
 .header{padding:0 16px}
 .badge{display:none}
 .container{width:94%;padding-top:25px}
 .quiz{padding:20px}
 .answers{grid-template-columns:1fr}
 .answer{min-height:70px}
}
</style>
</head>

<body>

<header class="header">
 <div class="logo">
  <div class="logo-icon">⚛</div>
  Science Rush
 </div>
 <div class="badge">✦ AI + RANDOM</div>
</header>

<main class="container">

<section id="startScreen" class="screen active">
 <div class="glass start">
  <div class="start-icon">🧪</div>
  <h1>Science Rush</h1>
  <p class="subtitle">
   Random questions. Fast answers. How high can you score?
  </p>
  <button class="primary" onclick="startQuiz()">
   Start Quiz →
  </button>
 </div>
</section>

<section id="quizScreen" class="screen">
 <div class="glass quiz">

  <div class="top-info">
   <div id="questionNumber" class="question-number">
    Question 1 / 10
   </div>
   <div id="scoreText" class="score">
    ⭐ 0
   </div>
  </div>

  <div class="progress">
   <div id="progressFill" class="progress-fill"></div>
  </div>

  <div id="loading" class="loading">
   <div class="spinner"></div>
   <div>Finding a random science question...</div>
  </div>

  <div id="questionArea" style="display:none">

   <div class="question-label">
    RANDOM SCIENCE
   </div>

   <div id="question" class="question"></div>

   <div id="answers" class="answers"></div>

   <div id="feedback" class="feedback"></div>

   <div class="bottom">
    <div id="source" class="source"></div>

    <button id="nextBtn" class="next" onclick="nextQuestion()">
     Next →
    </button>
   </div>

  </div>
 </div>
</section>

<section id="resultScreen" class="screen">
 <div class="glass result">
  <div class="trophy">🏆</div>
  <h1>Quiz Complete!</h1>

  <div id="resultScore" class="final-score">
   0 / 10
  </div>

  <p id="resultMessage" class="subtitle"></p>

  <button class="primary" onclick="startQuiz()">
   Play Again ↻
  </button>
 </div>
</section>

</main>

<script>
const MAX_QUESTIONS=10;

let score=0;
let questionNumber=0;
let currentQuiz=null;
let answered=false;

function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>{
  s.classList.remove("active");
 });
 document.getElementById(id).classList.add("active");
}

function startQuiz(){
 score=0;
 questionNumber=0;
 currentQuiz=null;
 showScreen("quizScreen");
 loadQuestion();
}

async function fetchQuestion(){
 const response=await fetch(
  "/api/question?t="+Date.now()+Math.random()
 );
 return await response.json();
}

async function loadQuestion(){

 answered=false;

 document.getElementById("loading").style.display="block";
 document.getElementById("questionArea").style.display="none";
 document.getElementById("nextBtn").style.display="none";

 document.getElementById("questionNumber").textContent=
  `Question ${questionNumber+1} / ${MAX_QUESTIONS}`;

 document.getElementById("scoreText").textContent=
  `⭐ ${score}`;

 document.getElementById("progressFill").style.width=
  `${(questionNumber/MAX_QUESTIONS)*100}%`;

 try{
  currentQuiz=await fetchQuestion();
  showQuestion();
 }catch{
  currentQuiz={
   question:"Which planet do humans live on?",
   choices:["Mars","Venus","Earth","Jupiter"],
   answer:2,
   explanation:"Earth is the planet where humans live.",
   source:"fallback"
  };
  showQuestion();
 }
}

function showQuestion(){

 document.getElementById("loading").style.display="none";
 document.getElementById("questionArea").style.display="block";

 document.getElementById("question").textContent=
  currentQuiz.question;

 const answers=document.getElementById("answers");
 answers.innerHTML="";

 const feedback=document.getElementById("feedback");
 feedback.className="feedback";
 feedback.innerHTML="";

 currentQuiz.choices.forEach((choice,index)=>{

  const button=document.createElement("button");

  button.className="answer";

  button.textContent=
   `${String.fromCharCode(65+index)}  ${choice}`;

  button.onclick=()=>{
   selectAnswer(index,button);
  };

  answers.appendChild(button);
 });

 document.getElementById("source").textContent=
  currentQuiz.source==="ai"
   ? "✦ AI-generated random question"
   : "⚡ Random backup question";
}

function selectAnswer(index,button){

 if(answered)return;

 answered=true;

 const buttons=document.querySelectorAll(".answer");

 buttons.forEach(b=>b.disabled=true);

 const feedback=document.getElementById("feedback");

 if(index===currentQuiz.answer){

  score++;

  button.classList.add("correct");

  feedback.classList.add("show","good");

  feedback.innerHTML=
   `<strong>✓ Correct!</strong><br>${currentQuiz.explanation}`;

 }else{

  button.classList.add("wrong");

  buttons[currentQuiz.answer].classList.add("correct");

  feedback.classList.add("show","bad");

  feedback.innerHTML=
   `<strong>✕ Wrong answer</strong><br>${currentQuiz.explanation}`;
 }

 document.getElementById("scoreText").textContent=
  `⭐ ${score}`;

 document.getElementById("progressFill").style.width=
  `${((questionNumber+1)/MAX_QUESTIONS)*100}%`;

 document.getElementById("nextBtn").style.display="block";
}

function nextQuestion(){

 questionNumber++;

 if(questionNumber>=MAX_QUESTIONS){
  showResult();
  return;
 }

 loadQuestion();
}

function showResult(){

 showScreen("resultScreen");

 document.getElementById("resultScore").textContent=
  `${score} / ${MAX_QUESTIONS}`;
cat >> index.html <<'EOF'

 const percentage=(score/MAX_QUESTIONS)*100;

 let message;

 if(percentage===100)
  message="PERFECT! You're a science machine. 🧠🔥";
 else if(percentage>=80)
  message="Excellent! Your science knowledge is strong. 🚀";
 else if(percentage>=60)
  message="Nice! You're getting there. 🔬";
 else if(percentage>=40)
  message="Good attempt! Keep learning. 💪";
 else
  message="Keep practicing. You can beat your score! ⚡";

 document.getElementById("resultMessage").textContent=message;
}
</script>

</body>
</html>
